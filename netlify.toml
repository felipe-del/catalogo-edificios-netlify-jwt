[build]
  command = "npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# netlify dev: sirve el frontend (Vite) y las funciones en http://localhost:8888
[dev]
  command = "npm --prefix frontend run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# SPA de Vue: cualquier ruta del frontend devuelve index.html
# (/api/* lo atiende la función por su config.path)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
